<!DOCTYPE html>
<html>
<head>
  <title>Haze PSI in your region</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    body {
      background-color: #F4F5F7;
      color: #1A1D23;
      font-family: 'IBM Plex Sans', sans-serif;
      margin: 0 auto;
    }
    .app {
      max-width: 480px;
      margin: 0 auto;
      padding: 36px 32px;
    }
    h1{
        font-size: 28px;
        font-weight: 600;
        margin: 0;
    }
    .subtitle{
        font-size: 14px;
        color:#555C68;
        margin:4px 0px 24px;
    }

    .controls {
        display: flex;
        gap: 10px;
        align-items: flex-end;
        margin-bottom: 24px;
    }
    .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
    }
    select, button {
    /* applies to both */
        height: 44px;
        border-radius: 8px;
        font-family: inherit;
        font-size: 15px;
    }
    select{
        padding: 0 12px;
        border: 1px solid #C2C8D1;
        background: white;
    }
    button{
        padding: 0 20px;
        border: 0;
        background: #1F3A5F;
        color: white;
        font-weight: 600;
        cursor: pointer;
    }

    .card{
        background: white;
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 4px 16px rgba(20, 24, 31, 0.08);
    }
    .place{
        font-size:14px;
        color: #555C68;
        margin-bottom:12px;
    }
    .reading{
        display:flex;
        flex-direction: row;
        gap: 16px;
        align-items: baseline;
    }

    .psi{
        font-family: 'IBM Plex Mono', monospace;
        font-size: 88px;
        font-weight: 600;
        line-height: 1 /*removes extra space above and below the big text*/
    }


    .badge{
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 600;
    }

    .scale{
        display:flex;
        flex-direction: row;
        gap:3px; 
        margin-top:20px;
    }
    .segment{
        flex: 1;
        display:flex;
        flex-direction: column;
        gap:6px;
        font-size: 11px;
        color:#555C68;
    }
    .bar{
        opacity: 0.35;
        height: 8px;
        border-radius:4px;
        background:#D5D9E0;
    }

    .segment.active .bar{
        opacity: 1;
        box-shadow: 0 0 0 2px #1A1D23;
    }
    .segment.active span{
        color: #1A1D23;
        font-weight: 600;
    }
    #chart { 
        width: 100%; 
        height: auto; 
        margin-top: 8px; 
    }
    .chart-label { 
        font-size: 13px; 
        color: #555C68; 
        margin: 20px 0 0; 
    }
  </style>





</head>
<body>
  <!-- your elements go here -->
  <main class="app">
  <h1>Haze Monitor</h1>
  <p class="subtitle">24-hr PSI . data from NEA</p>

  <div class="controls">
    <div class="field">
        <label for="regions">Your Area:</label>

        <select name="region" id="regions">
        <option value="yishun">yishun</option>
        <option value="bedok">bedok</option>
        <option value="marina bay">marina bay</option>
        <option value="jurong">jurong</option>
        <option value="orchard">orchard</option>
        </select>

    </div>
    <button type="button" id="locate-btn">Use my location</button>
    <button type="button" id="check-btn">Check PSI</button>
    
  </div>


    <div hidden class="card" id="card">
        <div class="place" id="place"></div>
        <div class="reading">
            <span class="psi" id="psi"></span>
            <span class="badge" id="badge"></span>
        </div>

        <div class="scale">
            <div class="segment" data-level="Good">
                <div class="bar"></div>
                <span>Good</span>
            </div>
            <div class="segment" data-level="Moderate">
                <div class="bar"></div>
                <span>Moderate</span>
            </div>
            <div class="segment" data-level="Unhealthy">
                <div class="bar"></div>
                <span>Unhealthy</span>
            </div>
            <div class="segment" data-level="Very unhealthy">
                <div class="bar"></div>
                <span>Very unhealthy</span>
            </div>
            <div class="segment" data-level="Hazardous">
                <div class="bar"></div>
                <span>Hazardous</span>
            </div>
        </div>

        <p class="chart-label">Last 24 hours</p>
        <svg id="chart" viewBox="0 0 400 120">
            <polyline id="chart-line" fill="none" stroke="#1F3A5F" stroke-width="2" />
        </svg>
    </div>


    </main>

    <script>


        const LEVEL_COLOURS = {
        "Good": "#7FD39A",
        "Moderate": "#8DB8FF",
        "Unhealthy": "#F6C343",
        "Very unhealthy": "#F5A35C",
        "Hazardous": "#F07070",
        };

        function drawChart(readings) {
            
            const n = readings.length;

            // find the highest PSI
            let max = 0;
            readings.forEach(r => {
                if (r.psi > max) max = r.psi;
            });

            // find the min PSI
            let min = Infinity;
            readings.forEach(r => {
                if (r.psi < min) min = r.psi;
            });
            if (n < 2 || max === min) return;
            // build the points string: "x,y x,y x,y ..."
            let points = "";
            readings.forEach((r, i) => {
                const x = i / (n - 1) * 400;
                const y = 110 - (r.psi - min) / (max - min) * 100;
                points += `${x},${y} `;
            });

            // put it on the line
            chartLine.setAttribute("points", points);
        }


        function showResult(data) {
        // code that uses data
         console.log(data);
                card.hidden = false;
                place.textContent = `${data.query} . (${data.region})`
                psi.textContent = `${data.psi}`
                badge.textContent = `${data.level}`
                badge.style.background = LEVEL_COLOURS[data.level]
                fetch(`/haze/history?region=${data.region}`)
                    .then(res => res.json())
                    .then(history => drawChart(history.readings));

                segments.forEach(seg => {
                    seg.classList.toggle("active", seg.dataset.level === data.level);
                });
        }

        const btn = document.getElementById("check-btn");
        const dropdown = document.getElementById("regions");
        const place = document.getElementById("place");
        const psi = document.getElementById("psi");
        const badge = document.getElementById("badge");
        const chartLine = document.getElementById("chart-line");

        const segments = document.querySelectorAll(".segment");

        segments.forEach(seg => {
            // runs once per segment; seg is the current one
            const level = seg.dataset.level;
            const color = LEVEL_COLOURS[level];
            seg.querySelector(".bar").style.background = color;
        });
        //hidden
        const card = document.getElementById("card");
        btn.addEventListener("click", () => {
            // code here runs on every click
            //console.log(dropdown.value);
            const url = `/haze?region=${dropdown.value}`
            fetch(url)
            .then(res => res.json())
            .then(data => showResult(data));
        });

        const locateBtn = document.getElementById("locate-btn");

        locateBtn.addEventListener("click", () => {
            navigator.geolocation.getCurrentPosition(pos => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                fetch(`/haze?lat=${lat}&lon=${lon}`)
                    .then(res => res.json())
                    .then(data => showResult(data));
            });
        });
    </script>
</body>
</html>
